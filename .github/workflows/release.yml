name: release

# Push a tag like v1.0.1 (it must match the version in pyproject.toml) to build all three
# installers and publish them as a GitHub release. "Run workflow" builds without publishing:
# the files are then under the run's Artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest      # Apple Silicon
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="v$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match pyproject version $want"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev libfontconfig1

      - name: Python packages
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install customtkinter pillow pyinstaller
          if [ "$RUNNER_OS" != "macOS" ]; then python -m pip install pystray; fi   # no tray on macOS
          if [ "$RUNNER_OS" != "Windows" ]; then python -m pip install keyring; fi

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHON: python
        run: |
          choco install innosetup --no-progress -y
          ./build.ps1

      - name: Build (macOS, Linux)
        if: runner.os != 'Windows'
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: |
            dist/JevSorter-*.exe
            dist/JevSorter-*.dmg
            dist/JevSorter-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: out
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "Jev Sorter ${GITHUB_REF_NAME#v}" \
            --notes-file packaging/release-notes.md --generate-notes
